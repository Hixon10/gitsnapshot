name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GO_VERSION: "1.27.1"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  GOARCH: amd64
  CGO_ENABLED: "0"

jobs:
  quality:
    name: Format, lint, and cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOS: windows
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install pinned linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
          skip-cache: true

      - name: Check formatting
        run: golangci-lint fmt --config=.golangci.yml --diff

      - name: Lint
        run: |
          golangci-lint config verify --config=.golangci.yml
          golangci-lint run --config=.golangci.yml

      - name: Cross-build Windows executable
        run: go build -trimpath -buildvcs=false -o snapshot.exe .

  windows-tests:
    name: Native Windows tests
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Test
        run: go test -count=1 .

      - name: Build
        run: go build -trimpath -buildvcs=false -o snapshot.exe .
